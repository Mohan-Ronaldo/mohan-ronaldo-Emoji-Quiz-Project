<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emoji quiz</title>
    <link rel="stylesheet" href="./Style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Guess the Emoji</h1>
      <div id="description"></div>
      <input type="text" id="guess-input" placeholder="Enter your Guess" />
      <div id="result"></div>
      <div id="score"></div>
      <div id="timer"></div>
      <div id="buttons">
        <button id="submitButton" class="button">Next Question</button>
        <button class="button" id="SkipQuestion" style="display: none;">
          Skip question
        </button>
        <button class="button" id="restart-button" style="display: none;">
          Restart
        </button>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
